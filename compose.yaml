services:
  app:
    build: .
    image: sl-utils:local
    restart: unless-stopped
    init: true
    ports:
      - "${SL_UTILS_BIND:-127.0.0.1}:${SL_UTILS_PORT:-3200}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOME: /tmp
      TMPDIR: /tmp
      TZ: UTC
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    memswap_limit: 256m
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    cpus: "1.0"
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: ${SL_UTILS_SUBNET:-172.28.0.0/24}
